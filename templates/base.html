<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Maison IRWA{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar">
        <a class="logo" href="{{ url_for('home') }}">{{ app_name }}</a>
        <div class="nav-links">
          <a href="{{ url_for('home') }}">Buscar</a>
          <a href="{{ url_for('search') }}?q=black%20cotton%20pant">Colecciones</a>
        </div>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>Maison IRWA · by Ivan, Stuart and Adrià</p>
    </footer>
  </body>
</html>
